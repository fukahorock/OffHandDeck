<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OffHandDeck - Hand Gesture Test</title>
<style>
  body {
    font-family: sans-serif;
    text-align: center;
    background: #1e1e1e;
    color: #eee;
    margin: 0;
    padding: 16px;
  }
  #status {
    margin: 8px;
    font-size: 14px;
    color: #9cf;
  }
  .layout {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 32px;
    flex-wrap: wrap;
    margin-top: 16px;
  }
  .left, .right {
    flex: 0 1 auto;
  }
  .stage {
    position: relative;
    width: 640px;
    max-width: 90vw;
    margin: 0 auto;
    transform: scaleX(-1); /* 鏡表示（映像・ランドマークをまとめて反転） */
  }
  video, canvas {
    width: 100%;
    display: block;
    border-radius: 8px;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
  }
  .result {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  .card {
    background: #2a2a2a;
    border-radius: 8px;
    padding: 16px 24px;
    min-width: 140px;
  }
  .card .label {
    font-size: 13px;
    color: #aaa;
  }
  .card .value {
    font-size: 28px;
    font-weight: bold;
    margin-top: 6px;
  }
  #poseResult {
    margin-top: 16px;
    font-size: 20px;
    font-weight: bold;
    color: #ffd479;
  }
  .right {
    text-align: left;
  }
  .right h2 {
    font-size: 16px;
    margin-bottom: 8px;
  }
  table {
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    border: 1px solid #444;
    padding: 4px 10px;
  }
  th {
    background: #2a2a2a;
  }
  tr.active {
    background: #3a6ea5;
  }
  .toggle-section {
    max-width: 900px;
    margin: 32px auto 0;
    background: #2a2a2a;
    border-radius: 8px;
    padding: 16px 24px;
  }
  .toggle-section h2 {
    font-size: 16px;
    margin: 0 0 12px;
  }
  .toggle-status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  #trackingBadge {
    font-size: 18px;
    font-weight: bold;
    padding: 6px 18px;
    border-radius: 20px;
  }
  #trackingBadge.on {
    background: #2e7d32;
    color: #fff;
  }
  #trackingBadge.off {
    background: #8a2020;
    color: #fff;
  }
  #toggleLog {
    display: flex;
    justify-content: center;
    gap: 8px;
    min-height: 32px;
    flex-wrap: wrap;
  }
  .log-chip {
    background: #1e1e1e;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 13px;
  }
  #toggleNote {
    margin-top: 10px;
    font-size: 12px;
    color: #999;
  }
  #resetLogBtn {
    padding: 6px 14px;
    font-size: 13px;
    border: none;
    border-radius: 6px;
    background: #3a6ea5;
    color: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>
<h1>ハンドジェスチャー認識テスト</h1>
<p id="status">カメラへのアクセスを許可してください</p>

<div class="layout">
  <div class="left">
    <div class="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>

    <div class="result">
      <div class="card">
        <div class="label">親指</div>
        <div class="value" id="thumbValue">-</div>
      </div>
      <div class="card">
        <div class="label">他4指の本数</div>
        <div class="value" id="countValue">-</div>
      </div>
    </div>

    <div id="poseResult">-</div>
  </div>

  <div class="right">
    <h2>ポーズ一覧</h2>
    <table id="poseTable">
      <thead>
        <tr><th>No</th><th>ポーズ</th><th>親指</th><th>他指本数</th></tr>
      </thead>
      <tbody>
        <tr data-thumb="false" data-count="0"><td>1</td><td>グー</td><td>OFF</td><td>0</td></tr>
        <tr data-thumb="true" data-count="0"><td>2</td><td>親指のみ</td><td>ON</td><td>0</td></tr>
        <tr data-thumb="true" data-count="1"><td>3</td><td>親指＋他指1本</td><td>ON</td><td>1</td></tr>
        <tr data-thumb="true" data-count="2"><td>4</td><td>親指＋他指2本</td><td>ON</td><td>2</td></tr>
        <tr data-thumb="false" data-count="1"><td>5</td><td>他指1本</td><td>OFF</td><td>1</td></tr>
        <tr data-thumb="false" data-count="2"><td>6</td><td>他指2本（チョキ）</td><td>OFF</td><td>2</td></tr>
        <tr data-thumb="false" data-count="3"><td>7</td><td>他指3本</td><td>OFF</td><td>3</td></tr>
        <tr data-thumb="false" data-count="4"><td>8</td><td>他指4本</td><td>OFF</td><td>4</td></tr>
        <tr data-thumb="true" data-count="4"><td>9</td><td>パー</td><td>ON</td><td>4</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="toggle-section">
  <h2>グーパーグーパー トグルテスト</h2>
  <div class="toggle-status">
    <span id="trackingBadge" class="on">トラッキング: ON</span>
    <button id="resetLogBtn">ログをリセット</button>
  </div>
  <div id="toggleLog"></div>
  <p id="toggleNote">グー→パー→グー→パーを素早く（2.5秒以内）連続で行うとトグルします。閾値は仕様未確定のため仮の値です。</p>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById('video');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');
const thumbValue = document.getElementById('thumbValue');
const countValue = document.getElementById('countValue');
const poseResult = document.getElementById('poseResult');
const poseRows = document.querySelectorAll('#poseTable tbody tr');
const trackingBadge = document.getElementById('trackingBadge');
const toggleLog = document.getElementById('toggleLog');
const resetLogBtn = document.getElementById('resetLogBtn');

// landmark index定義（MediaPipe Hands準拠）
const WRIST = 0;
const FINGERS = [
  { name: 'index', mcp: 5, pip: 6, tip: 8 },
  { name: 'middle', mcp: 9, pip: 10, tip: 12 },
  { name: 'ring', mcp: 13, pip: 14, tip: 16 },
  { name: 'pinky', mcp: 17, pip: 18, tip: 20 },
];
const THUMB = { mcp: 2, tip: 4 };
const PINKY_MCP = 17;

// 手の骨格の接続線（描画用）
const CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17],
];

function dist(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y, dz = (a.z || 0) - (b.z || 0);
  return Math.sqrt(dx * dx + dy * dy + dz * dz);
}

// 汎用デフォルト角度閾値の代替：手首からの距離比較でON/OFFを判定
function judgeFingerPattern(landmarks) {
  const wrist = landmarks[WRIST];
  const MARGIN = 1.1;

  // 親指は他指と可動方向が違うため、手首からの距離ではなく
  // 小指の付け根からの距離で「横に開いているか（立っているか）」を判定する
  const pinkyMcp = landmarks[PINKY_MCP];
  const THUMB_MARGIN = 1.05;
  const thumbOn = dist(landmarks[THUMB.tip], pinkyMcp) > dist(landmarks[THUMB.mcp], pinkyMcp) * THUMB_MARGIN;

  let otherCount = 0;
  for (const f of FINGERS) {
    const extended = dist(wrist, landmarks[f.tip]) > dist(wrist, landmarks[f.pip]) * MARGIN;
    if (extended) otherCount++;
  }

  return { thumbOn, otherCount };
}

function updatePoseTable(thumbOn, otherCount) {
  let matched = null;
  poseRows.forEach(row => {
    const rowThumb = row.dataset.thumb === 'true';
    const rowCount = Number(row.dataset.count);
    const isMatch = rowThumb === thumbOn && rowCount === otherCount;
    row.classList.toggle('active', isMatch);
    if (isMatch) matched = row.children[1].textContent;
  });
  poseResult.textContent = matched ? `判定ポーズ： ${matched}` : '該当ポーズなし';
}

// グー→パー→グー→パー トグル検出（仕様未確定のため閾値は仮の値）
const TOGGLE_WINDOW_MS = 2500;
let trackingOn = true;
let toggleEvents = [];
let lastToggleState = null;

function classifyToggleState(thumbOn, otherCount) {
  if (!thumbOn && otherCount === 0) return 'グー';
  if (thumbOn && otherCount === 4) return 'パー';
  return null;
}

function renderToggleLog() {
  toggleLog.innerHTML = '';
  toggleEvents.forEach(ev => {
    const chip = document.createElement('span');
    chip.className = 'log-chip';
    chip.textContent = ev.state;
    toggleLog.appendChild(chip);
  });
}

function setTracking(on) {
  trackingOn = on;
  trackingBadge.textContent = `トラッキング: ${on ? 'ON' : 'OFF'}`;
  trackingBadge.className = on ? 'on' : 'off';
}

function handleToggleDetection(thumbOn, otherCount) {
  const state = classifyToggleState(thumbOn, otherCount);
  if (state && state !== lastToggleState) {
    toggleEvents.push({ state, time: performance.now() });
    if (toggleEvents.length > 4) toggleEvents.shift();
    renderToggleLog();

    if (toggleEvents.length === 4) {
      const seq = toggleEvents.map(e => e.state).join(',');
      const elapsed = toggleEvents[3].time - toggleEvents[0].time;
      if (seq === 'グー,パー,グー,パー' && elapsed <= TOGGLE_WINDOW_MS) {
        setTracking(!trackingOn);
        toggleEvents = [];
        renderToggleLog();
      }
    }
  }
  lastToggleState = state;
}

resetLogBtn.addEventListener('click', () => {
  toggleEvents = [];
  lastToggleState = null;
  renderToggleLog();
});

function drawLandmarks(landmarks) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#00e0ff';
  ctx.lineWidth = 2;
  for (const [a, b] of CONNECTIONS) {
    const p1 = landmarks[a], p2 = landmarks[b];
    ctx.beginPath();
    ctx.moveTo(p1.x * canvas.width, p1.y * canvas.height);
    ctx.lineTo(p2.x * canvas.width, p2.y * canvas.height);
    ctx.stroke();
  }
  ctx.fillStyle = '#ffd479';
  for (const p of landmarks) {
    ctx.beginPath();
    ctx.arc(p.x * canvas.width, p.y * canvas.height, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

let handLandmarker = null;

async function init() {
  status.textContent = 'モデルを読み込み中...';
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "CPU"
    },
    runningMode: "VIDEO",
    numHands: 1
  });

  status.textContent = 'カメラへのアクセスを許可してください';
  const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
  video.srcObject = stream;
  await new Promise(resolve => { video.onloadedmetadata = resolve; });
  video.play();

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  status.textContent = '検出中...';

  requestAnimationFrame(loop);
}

let lastTime = -1;
function loop() {
  if (video.readyState >= 2 && video.currentTime !== lastTime) {
    lastTime = video.currentTime;
    const result = handLandmarker.detectForVideo(video, performance.now());

    if (result.landmarks && result.landmarks.length > 0) {
      const landmarks = result.landmarks[0];
      drawLandmarks(landmarks);
      const { thumbOn, otherCount } = judgeFingerPattern(landmarks);
      thumbValue.textContent = thumbOn ? 'ON' : 'OFF';
      countValue.textContent = otherCount;

      handleToggleDetection(thumbOn, otherCount);

      if (trackingOn) {
        updatePoseTable(thumbOn, otherCount);
      } else {
        poseResult.textContent = 'OFF中（トグル検出のみ動作中）';
        poseRows.forEach(row => row.classList.remove('active'));
      }
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      thumbValue.textContent = '-';
      countValue.textContent = '-';
      poseResult.textContent = '手が検出されていません';
      poseRows.forEach(row => row.classList.remove('active'));
    }
  }
  requestAnimationFrame(loop);
}

init().catch(err => {
  status.textContent = '初期化に失敗しました: ' + err.message;
});
</script>
</body>
</html>
